<style>
	:root {
		--bg: #f8f7f4;
		--surface: #ffffff;
		--text: #1e1b17;
		--muted: #7a746b;
		--line: rgba(30, 27, 23, 0.08);
		--brand: #d9642b;
		--brand-dark: #b94f1c;
		--brand-soft: rgba(217, 100, 43, 0.12);
		--ok: #2e9e5b;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #1e1b17;
			--surface: #292521;
			--text: #f3efe9;
			--muted: #a8a197;

	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { height: 100%; }

		background: var(--bg);

		padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
		user-select: none;

	header { padding: 28px 0 0; text-align: center; }
	.logo { height: 26px; width: auto; margin: 0 auto; }
	.logo-light { display: none; }

	main {
		flex: 1;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		text-align: center;
		padding-bottom: 40px;
		animation: rise 0.5s ease-out both;
	}

	.art { position: relative; width: 168px; height: 168px; margin-bottom: 32px; }

		position: absolute;
		inset: 0;
		border-radius: 50%;
		background: var(--brand-soft);
		animation: pulse 2.6s ease-out infinite;
	}
	.ring:nth-child(2) { animation-delay: 1.3s; }
	.disc {
		position: absolute;
		inset: 22px;
		border-radius: 50%;
		background: var(--surface);
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

		align-items: center;
		justify-content: center;

	.badge {
		position: absolute;
		right: 18px;
		bottom: 18px;
		width: 44px;
		height: 44px;
		border-radius: 50%;
		background: var(--brand);
		border: 4px solid var(--bg);
		display: flex;
		align-items: center;
		justify-content: center;
		color: #fff;
		transition: background 0.3s;
	}
	.badge svg { width: 20px; height: 20px; }
	.badge .on { display: none; }
	body.online .badge { background: var(--ok); }
	body.online .badge .off { display: none; }
	body.online .badge .on { display: block; }

	h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; font-weight: 700; }
	p { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 0 auto; max-width: 300px; }

	.tips {
		list-style: none;
		margin: 28px auto 0;
		padding: 16px 18px;
		width: 100%;
		max-width: 320px;
		text-align: start;
		background: var(--surface);
		border: 1px solid var(--line);
		border-radius: 16px;
	}
	.tips li {
		display: flex;
		align-items: center;
		gap: 12px;
		font-size: 14px;
		padding: 8px 0;
	}
	.tips li + li { border-top: 1px solid var(--line); }
	.tips svg { flex: none; width: 20px; height: 20px; color: var(--brand); }

	footer { padding: 0 0 28px; }
	button {
		width: 100%;
		max-width: 360px;
		margin: 0 auto;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 10px;
		border: 0;
		border-radius: 14px;
		padding: 16px;
		background: var(--brand);
		color: #fff;
		font: inherit;
		font-size: 16px;
		font-weight: 600;
		box-shadow: 0 8px 20px rgba(217, 100, 43, 0.3);
		transition: transform 0.12s, background 0.2s;
	}
	button:active { transform: scale(0.97); background: var(--brand-dark); }
	.spinner {
		display: none;
		width: 18px;
		height: 18px;
		border: 2.5px solid rgba(255, 255, 255, 0.35);
		border-top-color: #fff;
		border-radius: 50%;
		animation: spin 0.8s linear infinite;
	}
	body.checking .spinner { display: block; }
	body.checking button { pointer-events: none; opacity: 0.85; }
	.status { margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; }

	@keyframes pulse {
		0% { transform: scale(0.75); opacity: 1; }
		100% { transform: scale(1.25); opacity: 0; }
	}
	@keyframes spin { to { transform: rotate(360deg); } }
	@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
	@media (prefers-reduced-motion: reduce) { .ring, main { animation: none; } }
	@media (max-height: 640px) { .tips { display: none; } .art { margin-bottom: 20px; } }
</style>

	<main>
		<div class="art">

			<div class="disc"><div class="chair"></div></div>

	<footer>
		<button id="retry" type="button"><span class="spinner"></span><span data-t="retry">Qayta urinish</span></button>
		<div class="status" id="status"></div>
	</footer>

	<script>
		var SITE_URL = 'https://zinfurn.uz';
		var AUTO_CHECK_MS = 5000;
		var CHECK_TIMEOUT_MS = 6000;
		var MIN_SPINNER_MS = 700;

		var TEXTS = {
			en: {
				title: 'No internet connection',
				text: 'Zinfurn needs the internet. The page will open by itself once you are back online.',
				tip1: 'Check that Wi-Fi or mobile data is on', tip2: 'Turn off airplane mode', tip3: 'Try restarting your router',
				retry: 'Try again', checking: 'Checking connection…', still: 'Still offline — checking automatically', back: 'Connected! Opening…'
			},
			ru: {
				title: 'Нет подключения к интернету',
				text: 'Для Zinfurn нужен интернет. Страница откроется сама, как только связь восстановится.',
				tip1: 'Проверьте, включены ли Wi-Fi или мобильный интернет', tip2: 'Выключите режим полёта', tip3: 'Попробуйте перезагрузить роутер',
				retry: 'Повторить', checking: 'Проверяем подключение…', still: 'Связи пока нет — проверяем автоматически', back: 'Подключено! Открываем…'
			},
			ko: {
				title: '인터넷 연결 없음',
				text: 'Zinfurn을 사용하려면 인터넷이 필요합니다. 연결되면 페이지가 자동으로 열립니다.',
				tip1: 'Wi-Fi 또는 모바일 데이터가 켜져 있는지 확인하세요', tip2: '비행기 모드를 끄세요', tip3: '라우터를 다시 시작해 보세요',
				retry: '다시 시도', checking: '연결 확인 중…', still: '아직 오프라인 — 자동으로 확인 중', back: '연결됨! 여는 중…'
			},
			ar: {
				title: 'لا يوجد اتصال بالإنترنت',
				text: 'يحتاج Zinfurn إلى الإنترنت. ستفتح الصفحة تلقائيًا عند عودة الاتصال.',
				tip1: 'تأكد من تشغيل Wi-Fi أو بيانات الجوال', tip2: 'أوقف وضع الطيران', tip3: 'جرّب إعادة تشغيل الراوتر',
				retry: 'إعادة المحاولة', checking: 'جارٍ التحقق من الاتصال…', still: 'لا يزال غير متصل — يتم التحقق تلقائيًا', back: 'تم الاتصال! جارٍ الفتح…'
			},
			uz: {
				checking: 'Aloqa tekshirilmoqda…', still: "Hali aloqa yo'q — avtomatik tekshirilmoqda", back: 'Ulandi! Ochilmoqda…'
			}
		};

		var lang = (navigator.language || 'uz').slice(0, 2);
		var dict = TEXTS[lang] || TEXTS.uz;
		if (TEXTS[lang] && lang !== 'uz') {
			document.documentElement.lang = lang;
			if (lang === 'ar') document.documentElement.dir = 'rtl';
			document.querySelectorAll('[data-t]').forEach(function (el) {
				var key = el.getAttribute('data-t');
				if (dict[key]) el.textContent = dict[key];
			});
		}

		var body = document.body;
		var status = document.getElementById('status');
		var checking = false;

		function isReachable() {
			var controller = new AbortController();
			var timer = setTimeout(function () { controller.abort(); }, CHECK_TIMEOUT_MS);
			return fetch(SITE_URL + '/?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
				.then(function () { return true; }, function () { return false; })
				.finally(function () { clearTimeout(timer); });
		}

		function openSite() {
			body.classList.add('online');
			status.textContent = dict.back;
			setTimeout(function () { location.replace(SITE_URL); }, 400);
		}

		function check(manual) {
			if (checking) return;
			checking = true;
			if (manual) {
				body.classList.add('checking');
				status.textContent = dict.checking;
			}
			var started = Date.now();
			isReachable().then(function (ok) {
				var wait = manual ? Math.max(0, MIN_SPINNER_MS - (Date.now() - started)) : 0;
				setTimeout(function () {
					checking = false;
					body.classList.remove('checking');
					if (ok) return openSite();
					if (manual) status.textContent = dict.still;
				}, wait);
			});
		}

		document.getElementById('retry').addEventListener('click', function () { check(true); });
		window.addEventListener('online', function () { check(false); });
		setInterval(function () { check(false); }, AUTO_CHECK_MS);
	</script>
